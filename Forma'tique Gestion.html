<style>
/* Layout: private back office — sidebar app, one distinct screen per tab, same slate blue + gorse identity as the public site */
:root{

  --r:14px; --r-lg:20px; --shadow:0 1px 2px rgba(22,36,58,.06), 0 8px 24px rgba(22,36,58,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1620; --surface:#16212F; --surface-2:#1C2A3B; --ink:#E7EDF4; --muted:#9BA9BC; --line:#2A3A4E;
  --primary:#86B6E6; --primary-ink:#0E1620; --primary-soft:#1B2F45; --sun:#F2B33D; --sun-soft:#3A2E15; --sun-ink:#FCEFD3;
  --good:#63C79A; --good-soft:#163428; --warn:#E6B45A; --warn-soft:#382A12; --bad:#F08A8A; --bad-soft:#3B1C1C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#16212F; --surface-2:#1C2A3B; --ink:#E7EDF4; --muted:#9BA9BC; --line:#2A3A4E;
  --primary:#86B6E6; --primary-ink:#0E1620; --primary-soft:#1B2F45; --sun:#F2B33D; --sun-soft:#3A2E15; --sun-ink:#FCEFD3;
  --good:#63C79A; --good-soft:#163428; --warn:#E6B45A; --warn-soft:#382A12; --bad:#F08A8A; --bad-soft:#3B1C1C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}

/* Pure helpers shared by the page (inlined at build) — tested with node */
function crc32(b){let crc=-1;for(let i=0;i<b.length;i++){crc^=b[i];for(let k=0;k<8;k++)crc=(crc>>>1)^(0xEDB88320&-(crc&1));}return (crc^-1)>>>0;}
function makeZipParts(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  for(const f of files){
    const nm=enc.encode(f.name), data=enc.encode(f.text), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,0,true); lh.setUint16(12,0x21,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true);
    lh.setUint32(22,data.length,true); lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x21,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,nm.length,true);
    ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+data.length;
  }
  const cs=central.reduce((a,b)=>a+b.length,0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cs,true); end.setUint32(16,off,true);
  return [...parts,...central,new Uint8Array(end.buffer)];
}

/* Factur-X / EN 16931 CII XML for an invoice in VAT franchise (category E) */
function ciiXML(d,client,seller){
  const lines=(d.lignes||[]).map((l,i)=>{const tot=(Number(l.qte)||0)*(Number(l.pu)||0);return `
    <ram:IncludedSupplyChainTradeLineItem>
      <ram:AssociatedDocumentLineDocument><ram:LineID>${i+1}</ram:LineID></ram:AssociatedDocumentLineDocument>
      <ram:SpecifiedTradeProduct><ram:Name>${xesc(l.desc)}</ram:Name></ram:SpecifiedTradeProduct>
      <ram:SpecifiedLineTradeAgreement><ram:NetPriceProductTradePrice><ram:ChargeAmount>${amt(l.pu)}</ram:ChargeAmount></ram:NetPriceProductTradePrice></ram:SpecifiedLineTradeAgreement>
      <ram:SpecifiedLineTradeDelivery><ram:BilledQuantity unitCode="C62">${Number(l.qte)||0}</ram:BilledQuantity></ram:SpecifiedLineTradeDelivery>
      <ram:SpecifiedLineTradeSettlement>
        <ram:ApplicableTradeTax><ram:TypeCode>VAT</ram:TypeCode><ram:CategoryCode>E</ram:CategoryCode><ram:RateApplicablePercent>0</ram:RateApplicablePercent></ram:ApplicableTradeTax>
        <ram:SpecifiedTradeSettlementLineMonetarySummation><ram:LineTotalAmount>${amt(tot)}</ram:LineTotalAmount></ram:SpecifiedTradeSettlementLineMonetarySummation>
      </ram:SpecifiedLineTradeSettlement>
    </ram:IncludedSupplyChainTradeLineItem>`;}).join("");
  const total=(d.lignes||[]).reduce((a,l)=>a+(Number(l.qte)||0)*(Number(l.pu)||0),0);
  const paid=d.statut==="payée";
  const siren=(seller.siret||"").replace(/\D/g,"").slice(0,9);
  const bsiren=(client.siren||"").replace(/\D/g,"").slice(0,9);
  const addr=(a,cp)=>`<ram:PostalTradeAddress>${a?`<ram:LineOne>${xesc(a)}</ram:LineOne>`:""}${cp?`<ram:CityName>${xesc(cp)}</ram:CityName>`:""}<ram:CountryID>FR</ram:CountryID></ram:PostalTradeAddress>`;
  return `<?xml version="1.0" encoding="UTF-8"?>
<rsm:CrossIndustryInvoice xmlns:rsm="urn:un:unece:uncefact:data:standard:CrossIndustryInvoice:100" xmlns:ram="urn:un:unece:uncefact:data:standard:ReusableAggregateBusinessInformationEntity:100" xmlns:udt="urn:un:unece:uncefact:data:standard:UnqualifiedDataType:100">
  <rsm:ExchangedDocumentContext>
    <ram:BusinessProcessSpecifiedDocumentContextParameter><ram:ID>A1</ram:ID></ram:BusinessProcessSpecifiedDocumentContextParameter>
    <ram:GuidelineSpecifiedDocumentContextParameter><ram:ID>urn:cen.eu:en16931:2017</ram:ID></ram:GuidelineSpecifiedDocumentContextParameter>
  </rsm:ExchangedDocumentContext>
  <rsm:ExchangedDocument>
    <ram:ID>${xesc(d.numero)}</ram:ID>
    <ram:TypeCode>380</ram:TypeCode>
    <ram:IssueDateTime><udt:DateTimeString format="102">${d102(d.date)}</udt:DateTimeString></ram:IssueDateTime>
    <ram:IncludedNote><ram:Content>${xesc(seller.mentionTva||"TVA non applicable, art. 293 B du CGI")}</ram:Content><ram:SubjectCode>AAI</ram:SubjectCode></ram:IncludedNote>
    <ram:IncludedNote><ram:Content>Catégorie de l'opération : prestation de services</ram:Content></ram:IncludedNote>
  </rsm:ExchangedDocument>
  <rsm:SupplyChainTradeTransaction>${lines}
    <ram:ApplicableHeaderTradeAgreement>
      <ram:SellerTradeParty>
        <ram:Name>${xesc(seller.nomLegal||"Forma'tique")}</ram:Name>
        ${siren?`<ram:SpecifiedLegalOrganization><ram:ID schemeID="0002">${siren}</ram:ID></ram:SpecifiedLegalOrganization>`:""}
        ${addr(seller.adresse,"")}
      </ram:SellerTradeParty>
      <ram:BuyerTradeParty>
        <ram:Name>${xesc(client.nom||"")}</ram:Name>
        ${bsiren?`<ram:SpecifiedLegalOrganization><ram:ID schemeID="0002">${bsiren}</ram:ID></ram:SpecifiedLegalOrganization>`:""}
        ${addr(client.adresse,client.commune)}
      </ram:BuyerTradeParty>
    </ram:ApplicableHeaderTradeAgreement>
    <ram:ApplicableHeaderTradeDelivery>${d.date?`<ram:ActualDeliverySupplyChainEvent><ram:OccurrenceDateTime><udt:DateTimeString format="102">${d102(d.date)}</udt:DateTimeString></ram:OccurrenceDateTime></ram:ActualDeliverySupplyChainEvent>`:""}</ram:ApplicableHeaderTradeDelivery>
    <ram:ApplicableHeaderTradeSettlement>
      <ram:InvoiceCurrencyCode>EUR</ram:InvoiceCurrencyCode>
      <ram:SpecifiedTradeSettlementPaymentMeans><ram:TypeCode>${PAY_CODE[d.modePaiement]||"30"}</ram:TypeCode></ram:SpecifiedTradeSettlementPaymentMeans>
      <ram:ApplicableTradeTax>
        <ram:CalculatedAmount>0.00</ram:CalculatedAmount><ram:TypeCode>VAT</ram:TypeCode>
        <ram:ExemptionReason>${xesc(seller.mentionTva||"TVA non applicable, art. 293 B du CGI")}</ram:ExemptionReason>
        <ram:BasisAmount>${amt(total)}</ram:BasisAmount><ram:CategoryCode>E</ram:CategoryCode><ram:RateApplicablePercent>0</ram:RateApplicablePercent>
      </ram:ApplicableTradeTax>
      ${d.echeance?`<ram:SpecifiedTradePaymentTerms><ram:DueDateDateTime><udt:DateTimeString format="102">${d102(d.echeance)}</udt:DateTimeString></ram:DueDateDateTime></ram:SpecifiedTradePaymentTerms>`:""}
      <ram:SpecifiedTradeSettlementHeaderMonetarySummation>
        <ram:LineTotalAmount>${amt(total)}</ram:LineTotalAmount>
        <ram:TaxBasisTotalAmount>${amt(total)}</ram:TaxBasisTotalAmount>
        <ram:TaxTotalAmount currencyID="EUR">0.00</ram:TaxTotalAmount>
        <ram:GrandTotalAmount>${amt(total)}</ram:GrandTotalAmount>
        ${paid?`<ram:TotalPrepaidAmount>${amt(total)}</ram:TotalPrepaidAmount>`:""}
        <ram:DuePayableAmount>${amt(paid?0:total)}</ram:DuePayableAmount>
      </ram:SpecifiedTradeSettlementHeaderMonetarySummation>
    </ram:ApplicableHeaderTradeSettlement>
  </rsm:SupplyChainTradeTransaction>
</rsm:CrossIndustryInvoice>
`;
}

const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||ICONS.check}</svg>`;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{if(!s)return null;const [y,m,d]=s.slice(0,10).split("-").map(Number);return new Date(y,m-1,d);};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d);};

const fmtShort=s=>s?parseISO(s).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}):"";

function docStatus(d){if(isLate(d))return["En retard","bad"];const m={"brouillon":["Brouillon",""],"envoyé":["Envoyé","info"],"accepté":["Accepté","good"],"refusé":["Refusé","bad"],"facturé":["Facturé","good"],"à payer":["À payer","warn"],"payée":["Payée","good"]};return m[d.statut]||[d.statut,""];}

function autoRelances(){
  const out=[],t=today(),j=Number(S.settings.relanceDevisJours)||7;
  S.docs.forEach(d=>{
    if(d.kind==="devis"&&d.statut==="envoyé"&&d.date&&addDays(d.date,j)<=t) out.push({titre:`Relancer le devis ${d.numero}`,sous:`${clientName(d.clientId)} · envoyé le ${fmtDate(d.date)} · ${eur(docTotal(d))}`,date:addDays(d.date,j),docId:d.id,niveau:"warn"});
    if(isLate(d)) out.push({titre:`Facture ${d.numero} impayée`,sous:`${clientName(d.clientId)} · échue le ${fmtDate(d.echeance)} · ${eur(docTotal(d))}`,date:d.echeance,docId:d.id,niveau:"bad"});
  });
  S.seances.filter(x=>x.statut==="faite"&&!x.factureId&&x.date>=addDays(t,-60)&&!S.docs.some(d=>d.kind==="facture"&&d.clientId===x.clientId&&d.date>=x.date)).forEach(x=>out.push({titre:`Facturer la séance du ${fmtShort(x.date)}`,sous:`${clientName(x.clientId)} · ${x.formation||""}`,date:x.date,niveau:"info",clientId:x.clientId}));
  return out.sort((a,b)=>a.date<b.date?-1:1);
}

async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("formatique:"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
function lockScreen(){return `<div class="wrap gate"><form class="card" id="unlockForm"><div style="display:grid;place-items:center">${ic("lock").replace("<svg",'<svg style="width:40px;height:40px;stroke:var(--primary)"')}</div><h2>Espace verrouillé</h2><p class="note">Saisissez votre code pour continuer.</p><input class="pin" id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="Code"><div id="pinMsg"></div><button class="btn btn-primary" type="submit">Déverrouiller</button></form></div>`;}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="unlockForm")return; e.preventDefault();
  const v=$("#pinIn").value.trim(); if((await sha(v))===S.settings.pinHash){S.locked=false;try{sessionStorage.setItem("ft_unlock",S.settings.pinHash);}catch(_){}touch();render();}
  else{$("#pinMsg").innerHTML=`<div class="msg warn">Code incorrect.</div>`;$("#pinIn").value="";$("#pinIn").focus();}
});
let lastAct=Date.now();

["click","keydown","pointermove","scroll"].forEach(ev=>document.addEventListener(ev,touch,{passive:true}));

    <div class="box"><h3>À faire</h3><div class="list">${rel.length?rel.map(relanceLi).join(""):`<div class="empty">Rien à relancer pour l'instant.</div>`}</div></div></div>`;

function paneAgenda(){
  const m=S.calMonth,y=m.getFullYear(),mo=m.getMonth(),start=new Date(y,mo,1);start.setDate(1-((start.getDay()+6)%7));

  const caAn=months.reduce((a,b)=>a+b,0),cotis=caAn*(Number(st.tauxCotis)||0)/100;
  const devis=S.docs.filter(d=>d.kind==="devis"),dec=devis.filter(d=>["accepté","refusé","facturé"].includes(d.statut)),acc=devis.filter(d=>["accepté","facturé"].includes(d.statut));

  <div class="box chart"><h3>Encaissements par mois</h3>${barChart(months)}</div>

}
function barChart(vals){
  const W=720,H=240,pl=64,pb=28,pt=24,pr=8,mx=Math.max(...vals,1);
  const raw=mx/4,p=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/p,step=(n<=1?1:n<=2?2:n<=5?5:10)*p,top=Math.ceil(mx/step)*step;
  const bw=(W-pl-pr)/12,mn=["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"],cur=new Date().getMonth();
  let g="";for(let v=0;v<=top;v+=step){const yy=H-pb-(v/top)*(H-pb-pt);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pl-8}" y="${yy+4}" text-anchor="end">${v.toLocaleString("fr-FR")} €</text>`;}
  const bars=vals.map((v,i)=>{const h=(v/top)*(H-pb-pt),x=pl+i*bw+bw*.18,w=bw*.64,y=H-pb-h;return `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,0)}" rx="4" fill="${i===cur?"var(--sun)":"var(--primary)"}"><title>${mn[i]} : ${eur(v)}</title></rect>${v>0?`<text class="val" x="${x+w/2}" y="${y-6}" text-anchor="middle">${Math.round(v).toLocaleString("fr-FR")}</text>`:""}<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${mn[i]}</text>`;}).join("");
  return `<div class="tbl-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Encaissements mensuels">${g}${bars}</svg></div>`;
}

  $("#modalRoot").innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><form class="sheet" id="mform" novalidate><div class="sheet-head"><h3>${esc(title)}</h3><button type="button" class="x" data-close aria-label="Fermer">×</button></div><div class="sheet-body">${body}</div><div class="sheet-foot">${foot}</div></form></div>`;
  const f=$("#mform");
  f.addEventListener("submit",async e=>{e.preventDefault();if(!onSubmit)return;const b=f.querySelector("[type=submit]");if(b)b.disabled=true;try{const r=await onSubmit(new FormData(f),f);if(r!==false)closeModal();}catch(err){console.error(err);toast("L'enregistrement a échoué. Réessayez dans un instant.");}if(b)b.disabled=false;});
  $(".modal").addEventListener("mousedown",e=>{if(e.target.classList.contains("modal"))closeModal();});
  wirePickers(f); if(after) after(f);
  const first=f.querySelector("input:not([type=hidden]):not([type=radio]):not([type=checkbox]),select,textarea"); if(first) first.focus();
}
function closeModal(){$("#modalRoot").innerHTML="";}

const fld=(l,n,v="",t="text",x="")=>`<div class="f"><label for="m_${n}">${l}</label><input id="m_${n}" name="${n}" type="${t}" value="${esc(v)}" ${x}></div>`;
const area=(l,n,v="")=>`<div class="f"><label for="m_${n}">${l}</label><textarea id="m_${n}" name="${n}">${esc(v)}</textarea></div>`;
const sel=(l,n,o,v)=>`<div class="f"><label for="m_${n}">${l}</label><select id="m_${n}" name="${n}">${o.map(x=>{const [a,b]=Array.isArray(x)?x:[x,x];return `<option value="${esc(a)}" ${String(a)===String(v)?"selected":""}>${esc(b)}</option>`;}).join("")}</select></div>`;
const pills=(l,n,o,v)=>`<div class="f"><span class="lbl">${l}</span><div class="pills" role="radiogroup" aria-label="${esc(l)}">${o.map(([a,b])=>`<label><input type="radio" name="${n}" value="${esc(a)}" ${a===v?"checked":""}>${esc(b)}</label>`).join("")}</div></div>`;
const saveBtns=(delAct,id)=>`${delAct&&id?`<button type="button" class="btn btn-danger btn-sm" data-act="${delAct}" data-id="${id}" data-confirm style="margin-right:auto">Supprimer</button>`:""}<button type="button" class="btn btn-ghost" data-close>Annuler</button><button type="submit" class="btn btn-primary">Enregistrer</button>`;

/* Client picker: type a name, pick from the database or create */
function picker(name,id,label="Client",optional=false){
  const c=clientById(id);
  return `<div class="f" data-picker="${name}"><label for="pk_${name}">${label}${optional?" (facultatif)":""}</label><input id="pk_${name}" autocomplete="off" placeholder="Tapez un nom…" value="${esc(c?c.nom:"")}" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="pkl_${name}"><input type="hidden" name="${name}" value="${esc(id||"")}"><div class="pk-list" id="pkl_${name}" role="listbox" hidden></div></div>`;
}
function wirePickers(root){
  $$("[data-picker]",root).forEach(p=>{
    const inp=p.querySelector("input:not([type=hidden])"),hid=p.querySelector("input[type=hidden]"),list=p.querySelector(".pk-list");
    let items=[],active=-1;
    const show=()=>{const q=norm(inp.value.trim());
      items=S.clients.filter(c=>!q||norm(c.nom+" "+(c.commune||"")+" "+(c.tel||"")).includes(q)).sort((a,b)=>{const sa=norm(a.nom).startsWith(q)?0:1,sb=norm(b.nom).startsWith(q)?0:1;return sa-sb||a.nom.localeCompare(b.nom,"fr");}).slice(0,8);
      const exact=items.some(c=>norm(c.nom)===q);
      list.innerHTML=items.map((c,i)=>`<button type="button" role="option" data-i="${i}" class="${i===active?"on":""}"><b>${esc(c.nom)}</b><span>${esc(c.type)}${c.commune?" · "+esc(c.commune):""}${c.tel?" · "+esc(c.tel):""}</span></button>`).join("")+(inp.value.trim()&&!exact?`<button type="button" data-new>+ Créer le client « ${esc(inp.value.trim())} »</button>`:"")+(!items.length&&!inp.value.trim()?`<div class="note" style="padding:8px 11px">Aucun client enregistré.</div>`:"");
      list.hidden=false;inp.setAttribute("aria-expanded","true");};
    const hide=()=>{list.hidden=true;inp.setAttribute("aria-expanded","false");};
    const pick=c=>{inp.value=c.nom;hid.value=c.id;hide();};
    inp.addEventListener("input",()=>{hid.value="";active=-1;show();});
    inp.addEventListener("focus",show);
    inp.addEventListener("blur",()=>setTimeout(hide,150));
    inp.addEventListener("keydown",e=>{
      if(e.key==="ArrowDown"){active=Math.min(active+1,items.length-1);show();e.preventDefault();}
      else if(e.key==="ArrowUp"){active=Math.max(active-1,0);show();e.preventDefault();}
      else if(e.key==="Enter"&&!list.hidden){e.preventDefault();if(active>=0&&items[active])pick(items[active]);else if(items.length===1)pick(items[0]);}
      else if(e.key==="Escape"&&!list.hidden){hide();e.stopPropagation();}
    });
    list.addEventListener("mousedown",e=>e.preventDefault());
    list.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
      if(b.hasAttribute("data-new")){const nom=inp.value.trim();try{const id=await put("clients",{nom,type:"Particulier",commune:"",tel:"",email:"",adresse:"",notes:"",createdAt:today()});hid.value=id;hide();toast(`« ${nom} » ajouté à vos clients. Complétez sa fiche plus tard.`);}catch(err){toast("Le client n'a pas pu être créé.");}}
      else pick(items[+b.dataset.i]);});
  });
}

function nextNumero(kind){const y=new Date().getFullYear(),pre=(kind==="devis"?"D":"F")+"-"+y+"-";const n=S.docs.filter(d=>d.numero&&d.numero.startsWith(pre)).map(d=>parseInt(d.numero.slice(pre.length))||0);return pre+String((n.length?Math.max(...n):0)+1).padStart(3,"0");}

    `<div class="row2">${fld("Numéro","numero",d.numero||nextNumero(kind))}${fld("Date","date",d.date||today(),"date")}</div>${picker("clientId",d.clientId||preset.client)}
     <div class="row2">${fld(kind==="devis"?"Valable jusqu'au":"Échéance de paiement","echeance",d.echeance||addDays(today(),Number(st.delaiPaiement)||30),"date")}${sel("Statut","statut",statuts,d.statut||statuts[0])}</div>
     ${kind==="facture"?`${pills("Mode de paiement","modePaiement",PAY_MODES,d.modePaiement||"")}<div class="row2">${fld("Payée le","payeLe",d.payeLe||"","date")}<div></div></div>`:""}
     <div class="lines"><div class="line line-head"><span>Désignation</span><span>Qté</span><span>Prix unit.</span><span></span></div><div id="lineList" class="lines">${lignes.map(lineRow).join("")}</div><button type="button" class="btn btn-ghost btn-sm" data-line-add style="justify-self:start">${ic("plus")}Ajouter une ligne</button></div>
     <div class="total-row"><span>Total</span><span id="docTot" class="num">${eur(docTotal({lignes}))}</span></div><p class="note">${esc(st.mentionTva)}</p>${area("Notes (visibles sur le document)","notes",d.notes)}`,
    saveBtns("doc-del",d.id),
    async fd=>{if(!needClient(fd))return false;
      const ds=fd.getAll("l_desc"),qs=fd.getAll("l_qte"),ps=fd.getAll("l_pu");

      toast(kind==="devis"?"Devis enregistré":"Facture enregistrée");},
    f=>{const recalc=()=>{const q=$$("[name=l_qte]",f).map(i=>Number(i.value)||0),p=$$("[name=l_pu]",f).map(i=>Number(i.value)||0);$("#docTot").textContent=eur(q.reduce((a,x,i)=>a+x*p[i],0));};

    async fd=>{const d=Object.fromEntries(fd.entries());if(!d.titre.trim()){toast("Donnez un titre.");return false;}
      if(file){const type=FILE_TYPES[ext];if(!type){toast("Ce type de fichier n'est pas accepté. Utilisez un PDF ou une image.");return false;}
        if(file.size>20*1024*1024){toast("Fichier trop lourd (20 Mo maximum).");return false;}
        toast("Envoi du fichier…");
        try{const r=await S.assets.upload(file,{type});await put("fichiers",{...d,assetId:r.id,nomFichier:file.name,type:r.contentType,taille:r.sizeBytes,date:today()});toast("Document ajouté");}
        catch(e){toast(e.code==="too_large"?"Fichier trop lourd.":e.code==="unsupported_type"?"Ce type de fichier n'est pas accepté.":e.code==="quota_or_state"?"L'espace de stockage est plein.":"L'envoi a échoué. Réessayez.");return false;}}
      else{await put("fichiers",{...f,...d});toast("Document mis à jour");}});
}
async function downloadFile(id){const f=S.fichiers.find(x=>x.id===id);if(!f)return;
  try{const r=await fetch("/_blob/"+f.assetId);if(!r.ok)throw 0;const blob=await r.blob();await saveFile(f.nomFichier||f.titre,blob);}catch(e){toast("Le fichier est introuvable.");}}

/* Facture électronique */
function paForm(){const st=S.settings;openModal("Ma plateforme agréée",`${sel("Plateforme","pa",[["","— Choisir —"],...PLATEFORMES.map(p=>[p,p])],st.pa)}<div class="row2">${fld("Date d'inscription","paDate",st.paDate,"date")}${fld("Adresse de réception (facultatif)","paAdresse",st.paAdresse)}</div><p class="note">La liste officielle des plateformes agréées est publiée sur impots.gouv.fr.</p>`,saveBtns(),
  async fd=>{await saveSettings(Object.fromEntries(fd.entries()));toast("Plateforme enregistrée");});}
async function efExport(){
  const ids=[...S.efSel],sellers=S.settings,files=[],rows=[["numero","date","client","type_client","siren_client","total_eur","statut","paye_le","mode_paiement","categorie_operation"]];
  ids.forEach(id=>{const d=S.docs.find(x=>x.id===id);if(!d)return;const c=clientById(d.clientId)||{};
    files.push({name:`${d.numero}.xml`,text:ciiXML(d,c,sellers)});
    rows.push([d.numero,d.date,c.nom||"",isPro(c)?"professionnel":"particulier",c.siren||"",docTotal(d).toFixed(2).replace(".",","),d.statut,d.payeLe||"",d.modePaiement||"","prestation de services"]);});
  files.push({name:"recapitulatif.csv",text:"﻿"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\r\n")});
  const blob=new Blob(makeZipParts(files),{type:"application/zip"});
  if(await saveFile(`factures-${today()}.zip`,blob))toast("Export prêt : importez-le dans votre plateforme.");
}

/* Réglages */
function settingsForm(){const st=S.settings;openModal("Entreprise et facturation",`${fld("Nom légal (prénom NOM, EI)","nomLegal",st.nomLegal)}<div class="row2">${fld("SIRET","siret",st.siret)}${fld("N° de déclaration d'activité (NDA)","nda",st.nda)}</div>${fld("Adresse","adresse",st.adresse)}
  <div class="row2">${fld("Taux de cotisations Urssaf (%)","tauxCotis",st.tauxCotis,"number",'step="0.1"')}${fld("Délai de paiement (jours)","delaiPaiement",st.delaiPaiement,"number")}</div><div class="row2">${fld("Relancer un devis après (jours)","relanceDevisJours",st.relanceDevisJours,"number")}${fld("Mention TVA","mentionTva",st.mentionTva)}</div>
  <p class="note">Pensez à reporter vos mentions légales sur le site public (page « Modifier le site »).</p>`,saveBtns(),
  async fd=>{const d=Object.fromEntries(fd.entries());await saveSettings({...d,tauxCotis:Number(d.tauxCotis)||0,delaiPaiement:Number(d.delaiPaiement)||30,relanceDevisJours:Number(d.relanceDevisJours)||7});toast("Réglages enregistrés");});}
function pinForm(){openModal("Code de verrouillage",`${fld("Nouveau code (4 à 8 chiffres)","pin1","","password",'inputmode="numeric" maxlength="8" autocomplete="new-password"')}${fld("Confirmer le code","pin2","","password",'inputmode="numeric" maxlength="8" autocomplete="new-password"')}`,saveBtns(),
  async fd=>{const a=fd.get("pin1").trim(),b=fd.get("pin2").trim();if(!/^\d{4,8}$/.test(a)){toast("Le code doit contenir 4 à 8 chiffres.");return false;}if(a!==b){toast("Les deux codes ne correspondent pas.");return false;}const h=await sha(a);await saveSettings({pinHash:h});try{sessionStorage.setItem("ft_unlock",h);}catch(_){}toast("Code activé");});}

/* ---------- Actions ---------- */
async function onAction(b){
  const a=b.dataset.act,id=b.dataset.id;
  if(b.hasAttribute("data-confirm")&&!b.hasAttribute("data-armed")){b.setAttribute("data-armed","");const t=b.textContent;b.textContent="Confirmer ?";setTimeout(()=>{if(b.isConnected){b.removeAttribute("data-armed");b.textContent=t;}},4000);return;}
  try{switch(a){
    case "client-new":return clientForm();
    case "client-edit":return clientForm(clientById(id));
    case "client-view":return clientView(id);
    case "client-del":await del("clients",id);closeModal();return toast("Client supprimé");
    case "seance-new":return seanceForm({},{day:b.dataset.day,client:b.dataset.client});
    case "seance-edit":return seanceForm(S.seances.find(x=>x.id===id));
    case "seance-del":await del("seances",id);closeModal();return toast("Séance supprimée");
    case "seance-done":{const x=S.seances.find(s=>s.id===id);await put("seances",{...x,statut:"faite"});return toast("Séance faite. Elle apparaît dans « À faire » tant qu'elle n'est pas facturée.");}
    case "relance-new":return relanceForm();
    case "relance-edit":return relanceForm(S.relances.find(x=>x.id===id));
    case "relance-del":await del("relances",id);closeModal();return toast("Rappel supprimé");
    case "relance-done":{const r=S.relances.find(x=>x.id===id);await put("relances",{...r,fait:true});return toast("Rappel terminé");}
    case "proc-new":return procForm();
    case "proc-edit":return procForm(S.procedures.find(x=>x.id===id));
    case "proc-del":await del("procedures",id);closeModal();return toast("Liste supprimée");
    case "proc-reset":{const p=S.procedures.find(x=>x.id===id);return put("procedures",{...p,etapes:p.etapes.map(e=>({...e,fait:false}))});}
    case "docs-view":S.docsView=b.dataset.v;return draw();
    case "file-cat":S.fileCat=b.dataset.c;return draw();
    case "file-edit":return fileForm(S.fichiers.find(x=>x.id===id));
    case "file-dl":return downloadFile(id);
    case "file-del":{const f=S.fichiers.find(x=>x.id===id);if(f&&S.assets){try{await S.assets.delete(f.assetId);}catch(_){}}await del("fichiers",id);closeModal();return toast("Document supprimé");}
    case "doc-new":return docForm({},{kind:b.dataset.kind,client:b.dataset.client});
    case "doc-edit":return docForm(S.docs.find(x=>x.id===id));
    case "doc-view":return docView(id);
    case "doc-del":await del("docs",id);closeModal();return toast("Document supprimé");
    case "doc-filter":S.docFilter=b.dataset.f;return draw();
    case "doc-dl":return downloadDoc(id);
    case "doc-status":{const d=S.docs.find(x=>x.id===id);await put("docs",{...d,statut:b.dataset.s,...(b.dataset.s==="envoyé"?{date:today()}:{})});closeModal();return toast("Statut mis à jour");}
    case "doc-paid":{const d=S.docs.find(x=>x.id===id);await put("docs",{...d,statut:"payée",payeLe:today(),modePaiement:b.dataset.mode});closeModal();return toast(`Facture payée en ${payLabel(b.dataset.mode).toLowerCase()}`);}
    case "doc-tofacture":{const d=S.docs.find(x=>x.id===id);await put("docs",{kind:"facture",numero:nextNumero("facture"),clientId:d.clientId,date:today(),echeance:addDays(today(),Number(S.settings.delaiPaiement)||30),statut:"à payer",payeLe:"",modePaiement:"",notes:`Suite au devis ${d.numero}.`,lignes:d.lignes,fromDevis:d.id});await put("docs",{...d,statut:"facturé"});closeModal();return toast("Facture créée");}
    case "cal-prev":S.calMonth=new Date(S.calMonth.getFullYear(),S.calMonth.getMonth()-1,1);return draw();
    case "cal-next":S.calMonth=new Date(S.calMonth.getFullYear(),S.calMonth.getMonth()+1,1);return draw();
    case "cal-today":{const d=new Date();S.calMonth=new Date(d.getFullYear(),d.getMonth(),1);S.calDay=today();return draw();}
    case "cal-day":{S.calDay=b.dataset.day;const d=parseISO(S.calDay);if(d.getMonth()!==S.calMonth.getMonth())S.calMonth=new Date(d.getFullYear(),d.getMonth(),1);return draw();}
    case "pa-edit":return paForm();
    case "ef-all":{const inv=S.docs.filter(d=>d.kind==="facture");if(S.efSel.size===inv.length)S.efSel.clear();else inv.forEach(d=>S.efSel.add(d.id));return draw();}
    case "ef-export":return efExport();
    case "ef-mark":{for(const id2 of S.efSel){const d=S.docs.find(x=>x.id===id2);if(d)await put("docs",{...d,transmis:today()});}S.efSel.clear();return toast("Factures marquées comme transmises");}
    case "settings-edit":return settingsForm();
    case "pin-edit":return pinForm();
    case "pin-off":await saveSettings({pinHash:""});return toast("Code désactivé");
    case "del-examples":{for(const [c,arr] of [["docs",S.docs],["seances",S.seances],["clients",S.clients]])for(const x of arr.filter(y=>y.exemple))await del(c,x.id);return toast("Exemples supprimés");}
  }}catch(err){console.error(err);toast("L'action a échoué. Réessayez dans un instant.");}
}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-close]")){closeModal();return;}
  const t=e.target.closest("[data-tab]");if(t){S.tab=t.dataset.tab;closeModal();draw();window.scrollTo({top:0});return;}
  const b=e.target.closest("[data-act]");if(b){e.preventDefault();onAction(b);}
});
document.addEventListener("change",async e=>{
  const c=e.target.closest("[data-tick]");
  if(c){const p=S.procedures.find(x=>x.id===c.dataset.tick);if(!p)return;try{await put("procedures",{...p,etapes:p.etapes.map((x,i)=>i===Number(c.dataset.i)?{...x,fait:c.checked}:x)});}catch(_){toast("La case n'a pas pu être enregistrée.");}return;}
  const s=e.target.closest("[data-efsel]");
  if(s){s.checked?S.efSel.add(s.dataset.efsel):S.efSel.delete(s.dataset.efsel);draw();return;}
  if(e.target.id==="fileIn"&&e.target.files[0]){fileForm({},e.target.files[0]);e.target.value="";}
});
document.addEventListener("input",e=>{
  const id=e.target.id;if(id!=="clientSearch"&&id!=="fileSearch")return;
  if(id==="clientSearch")S.clientSearch=e.target.value;else S.fileSearch=e.target.value;
  const pos=e.target.selectionStart;draw();const i=document.getElementById(id);if(i){i.focus();i.setSelectionRange(pos,pos);}
});
document.addEventListener("dragover",e=>{const z=e.target.closest&&e.target.closest("#dropZone");if(z){e.preventDefault();z.classList.add("over");}});
document.addEventListener("dragleave",e=>{const z=e.target.closest&&e.target.closest("#dropZone");if(z)z.classList.remove("over");});
document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest("#dropZone");if(!z)return;e.preventDefault();z.classList.remove("over");const f=e.dataTransfer.files[0];if(f)fileForm({},f);});

/* ---------- Boot ---------- */
async function boot(){
  let n=0;while(!window.claude?.use&&n<20){await new Promise(r=>setTimeout(r,150));n++;}
  if(!window.claude?.use){render();return;}
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  S.db=db;S.user=user;
  if(user){S.uid=await user.id();S.admin=await user.canEdit();}
  if(!db)S.admin=false;
  if(!S.admin){render();return;}
  claude.use("assets").then(a=>{S.assets=a;render();});
  claude.use("downloads").then(d=>{S.dl=d;});
  let firstSettings=true;
  base().onSnapshot(s=>{S.settings={...SETTINGS_DEFAULT,...(s.exists?s.data():{})};S.settingsReady=true;
    if(firstSettings){firstSettings=false;let ok=false;try{ok=sessionStorage.getItem("ft_unlock")===S.settings.pinHash;}catch(_){}S.locked=!!S.settings.pinHash&&!ok;}
    render();},()=>{});
  const cols=["clients","docs","seances","relances","procedures","fichiers"];let got=0;
  cols.forEach(c=>col(c).onSnapshot(q=>{S[c]=q.docs.map(d=>({id:d.id,...d.data()}));if(!S.loaded[c]){S.loaded[c]=true;got++;if(got===cols.length)S.loaded.ready=true;}render();},()=>{}));
  render();
}
boot();
</script>
